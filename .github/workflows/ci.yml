name: Teedy CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven Build
        run: mvn clean package -DskipTests

      - name: PMD Code Check
        run: mvn pmd:pmd

      - name: Run Tests
        run: mvn test

      - name: Generate JavaDoc
        run: mvn javadoc:jar

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teedy-output
          path: |
            target/*.jar
            target/site/
            target/*-javadoc.jar