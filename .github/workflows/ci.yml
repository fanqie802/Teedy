name: Teedy CI Pipeline
on:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'maven' # 缓存Maven依赖，加速构建
    - name: Build with Maven
      run: mvn -B package --file pom.xml
